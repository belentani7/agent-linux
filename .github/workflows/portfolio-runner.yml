name: Verify Agent Linux portfolio runner
on:
  pull_request:
  push:
    branches: [main, feat/bounded-portfolio-runner-2026-10-21]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q scripts/portfolio_runner.py tests/test_portfolio_runner.py
      - name: Offline unit tests
        run: python -m unittest discover -s tests -p 'test_portfolio_runner.py' -v
      - name: Reject unsafe configuration
        run: python scripts/portfolio_runner.py --validate --config config/portfolio.example.json
