name: Agent Linux rootless container
on:
  pull_request:
    paths:
      - Dockerfile
      - .devcontainer/**
      - scripts/container-smoke.sh
      - tests/test_container.py
      - .github/workflows/container.yml
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Source contract and shell syntax
        run: |
          python3 -m unittest discover -s tests -p 'test_container.py' -v
          bash -n scripts/container-smoke.sh
      - name: Build image
        run: docker build --pull -t agent-linux:ci .
      - name: Run nonroot image without network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges agent-linux:ci \
            bash -c 'cd /workspace && bash /dev/stdin' < scripts/container-smoke.sh
