name: Cloud MCP integration tests

on:
  pull_request:
    paths:
      - "scripts/belentani_cloud_*.py"
      - "tests/test_belentani_cloud_core.py"
      - "config/ai-stack-catalog.json"
      - "config/mcp.cloud.example.json"
      - ".github/workflows/cloud-mcp-tests.yml"
  push:
    paths:
      - "scripts/belentani_cloud_*.py"
      - "tests/test_belentani_cloud_core.py"
      - "config/ai-stack-catalog.json"
      - "config/mcp.cloud.example.json"
      - ".github/workflows/cloud-mcp-tests.yml"

permissions:
  contents: read

jobs:
  unit-and-sdk-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python and JSON
        run: |
          python -m compileall -q scripts/belentani_cloud_core.py scripts/belentani_cloud_mcp.py
          python -m json.tool config/ai-stack-catalog.json > /dev/null
          python -m json.tool config/mcp.cloud.example.json > /dev/null
      - name: Run zero-network unit tests
        run: python -m unittest discover -s tests -p 'test_belentani_cloud_core.py' -v
      - name: Verify real MCP SDK import
        run: |
          python -m pip install 'mcp[cli]'
          python -c "import sys; sys.path.insert(0,'scripts'); from belentani_cloud_mcp import mcp; print(mcp.name)"
